services:
  postgres:
    image: postgres:16
    container_name: hwwc_postgres
    environment:
      POSTGRES_DB: hwwc_ticketing
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hwwc_redis
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:

