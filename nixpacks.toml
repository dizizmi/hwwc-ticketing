[phases.setup]
nixPkgs = ["php83", "php84Packages.composer"]

[phases.install]
cmds = ["cd start && composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = ["cd start && php artisan config:cache"]

[start]
cmd = "cd start && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
